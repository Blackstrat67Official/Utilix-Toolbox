<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>HTML Entities</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#81c995;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{padding:1rem;border-bottom:1px solid var(--border);display:flex;gap:10px;}
select{background:#000;color:#fff;border:1px solid var(--border);padding:6px 12px;border-radius:6px;outline:none;}
.grid{display:grid;grid-template-columns:1fr 1fr;flex-grow:1;}
textarea{background:transparent;color:#aaa;border:none;padding:1.5rem;font-family:'JetBrains Mono',monospace;font-size:0.9rem;resize:none;outline:none;}
.left{border-right:1px solid var(--border);} .out{color:var(--accent);background:#111;}
</style></head><body>
<div class="container">
    <div class="toolbar"><select id="mode"><option value="enc">Testo ➔ Sicuro (Encode)</option><option value="dec">Sicuro ➔ Testo (Decode)</option></select></div>
    <div class="grid">
        <textarea id="in" class="left" placeholder="Input... (es. <script>alert(1)</script>)"></textarea>
        <textarea id="out" class="out" readonly placeholder="Output..."></textarea>
    </div>
</div>
<script>
    const i=document.getElementById('in'), o=document.getElementById('out'), m=document.getElementById('mode');
    function convert() {
        if(m.value === 'enc') o.value = i.value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        else { const t=document.createElement('textarea'); t.innerHTML = i.value; o.value = t.value; }
    }
    i.addEventListener('input', convert); m.addEventListener('change', convert);
</script></body></html>
