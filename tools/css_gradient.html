<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>CSS Gradient</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#ba68c8;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:900px;display:flex;}
.controls{width:300px;padding:1.5rem;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:15px;}
label{font-size:0.8rem;color:#888;display:flex;justify-content:space-between;}
input[type=color]{width:100%;height:40px;border:none;background:none;cursor:pointer;}
input[type=range]{width:100%;accent-color:var(--accent);}
.preview{flex:1;display:flex;flex-direction:column;position:relative;}
.box{flex:1;background:linear-gradient(45deg, #ba68c8, #4fc3f7);}
.code{background:#000;padding:1.5rem;font-family:'JetBrains Mono',monospace;color:var(--accent);border-top:1px solid var(--border);text-align:center;}
</style></head><body>
<div class="container">
    <div class="controls">
        <div><label>Colore 1</label><input type="color" id="c1" value="#ba68c8"></div>
        <div><label>Colore 2</label><input type="color" id="c2" value="#4fc3f7"></div>
        <div><label>Angolo <span id="val">45°</span></label><input type="range" id="ang" min="0" max="360" value="45"></div>
    </div>
    <div class="preview">
        <div class="box" id="box"></div>
        <div class="code" id="code">background: linear-gradient(45deg, #ba68c8, #4fc3f7);</div>
    </div>
</div>
<script>
    function update() {
        const c1=document.getElementById('c1').value, c2=document.getElementById('c2').value, a=document.getElementById('ang').value;
        document.getElementById('val').innerText = a+'°';
        const css = `linear-gradient(${a}deg, ${c1}, ${c2})`;
        document.getElementById('box').style.background = css;
        document.getElementById('code').innerText = `background: ${css};`;
    }
    ['c1','c2','ang'].forEach(id => document.getElementById(id).addEventListener('input', update));
</script></body></html>
