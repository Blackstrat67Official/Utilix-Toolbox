<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>HTTP Status Reference</title>
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--bg-element:#141414;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#4dd0e1;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:800px;display:flex;flex-direction:column;overflow:hidden;}
.header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
input{background:var(--bg-body);color:var(--text-primary);border:1px solid var(--border);padding:10px 15px;border-radius:8px;outline:none;width:300px;}
.list{overflow-y:auto;padding:1rem;}
.item{display:flex;padding:12px;border-bottom:1px solid var(--border);align-items:center;gap:15px;}
.code{font-family:monospace;font-size:1.2rem;font-weight:bold;color:var(--accent);width:50px;}
.desc{flex:1;} .desc-title{font-weight:bold;font-size:1rem;} .desc-text{font-size:0.8rem;color:#888;margin-top:4px;}
.c2xx{color:#81c995;} .c3xx{color:#64b5f6;} .c4xx{color:#ffb74d;} .c5xx{color:#ff5252;}
</style></head><body>
<div class="container">
    <div class="header"><h2>HTTP Status Codes</h2> <input type="text" id="search" placeholder="Cerca codice o nome (es. 404)..."></div>
    <div class="list" id="list"></div>
</div>
<script>
    const codes = [
        {c:"200", n:"OK", d:"Richiesta riuscita. Risposta standard."}, {c:"201", n:"Created", d:"Risorsa creata con successo (spesso dopo POST)."},
        {c:"204", n:"No Content", d:"Richiesta riuscita ma nessun dato da restituire."},
        {c:"301", n:"Moved Permanently", d:"La risorsa è stata spostata definitivamente a un nuovo URL."}, {c:"302", n:"Found", d:"Reindirizzamento temporaneo."},
        {c:"400", n:"Bad Request", d:"Sintassi della richiesta non valida."}, {c:"401", n:"Unauthorized", d:"Autenticazione richiesta o fallita."},
        {c:"403", n:"Forbidden", d:"Il server ha capito la richiesta ma si rifiuta di autorizzarla."}, {c:"404", n:"Not Found", d:"Risorsa non trovata."},
        {c:"418", n:"I'm a teapot", d:"Scherzo del 1998 (April Fools). Il server rifiuta di preparare il caffè perché è una teiera."},
        {c:"429", n:"Too Many Requests", d:"Rate limit superato."}, {c:"500", n:"Internal Server Error", d:"Errore generico lato server."},
        {c:"502", n:"Bad Gateway", d:"Il server, agendo da gateway, ha ricevuto una risposta non valida."}, {c:"503", n:"Service Unavailable", d:"Server temporaneamente offline."}
    ];
    function render(f='') {
        const l = document.getElementById('list'); l.innerHTML = '';
        codes.filter(x => x.c.includes(f) || x.n.toLowerCase().includes(f.toLowerCase())).forEach(x => {
            let cl = x.c.startsWith('2')?'c2xx':x.c.startsWith('3')?'c3xx':x.c.startsWith('4')?'c4xx':'c5xx';
            l.innerHTML += `<div class="item"><div class="code ${cl}">${x.c}</div><div class="desc"><div class="desc-title">${x.n}</div><div class="desc-text">${x.d}</div></div></div>`;
        });
    }
    document.getElementById('search').addEventListener('input', e => render(e.target.value)); render();
</script></body></html>
