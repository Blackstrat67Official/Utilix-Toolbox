<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>CSS Filters</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--accent:#a5d6a7;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px;display:flex;}
.controls{width:300px;padding:1rem 1.5rem;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px;background:#050505;overflow-y:auto;}
.preview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
img{max-width:80%;max-height:60%;border-radius:8px;}
label{font-size:0.75rem;color:#aaa;display:flex;justify-content:space-between;} input[type=range]{width:100%;accent-color:var(--accent);}
.code{position:absolute;bottom:0;width:100%;background:#000;padding:1.5rem;font-family:'JetBrains Mono',monospace;color:var(--accent);border-top:1px solid var(--border);text-align:center;}
</style></head><body>
<div class="container">
    <div class="controls">
        <div><label>Blur <span id="v-bl">0px</span></label><input type="range" id="bl" min="0" max="20" value="0"></div>
        <div><label>Brightness <span id="v-br">100%</span></label><input type="range" id="br" min="0" max="200" value="100"></div>
        <div><label>Contrast <span id="v-co">100%</span></label><input type="range" id="co" min="0" max="200" value="100"></div>
        <div><label>Grayscale <span id="v-gr">0%</span></label><input type="range" id="gr" min="0" max="100" value="0"></div>
        <div><label>Hue-Rotate <span id="v-hu">0deg</span></label><input type="range" id="hu" min="0" max="360" value="0"></div>
        <div><label>Invert <span id="v-in">0%</span></label><input type="range" id="in" min="0" max="100" value="0"></div>
        <div><label>Saturate <span id="v-sa">100%</span></label><input type="range" id="sa" min="0" max="300" value="100"></div>
        <div><label>Sepia <span id="v-se">0%</span></label><input type="range" id="se" min="0" max="100" value="0"></div>
    </div>
    <div class="preview"><img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" id="img" alt="Test"><div class="code" id="code"></div></div>
</div>
<script>
    function update() {
        const p={bl:['px',document.getElementById('bl').value],br:['%',document.getElementById('br').value],co:['%',document.getElementById('co').value],gr:['%',document.getElementById('gr').value],hu:['deg',document.getElementById('hu').value],in:['%',document.getElementById('in').value],sa:['%',document.getElementById('sa').value],se:['%',document.getElementById('se').value]};
        let css = `filter: blur(${p.bl[1]}px) brightness(${p.br[1]}%) contrast(${p.co[1]}%) grayscale(${p.gr[1]}%) hue-rotate(${p.hu[1]}deg) invert(${p.in[1]}%) saturate(${p.sa[1]}%) sepia(${p.se[1]}%);`;
        Object.keys(p).forEach(k => document.getElementById(`v-${k}`).innerText = p[k][1]+p[k][0]);
        document.getElementById('img').style.cssText = css; document.getElementById('code').innerText = css;
    }
    ['bl','br','co','gr','hu','in','sa','se'].forEach(id => document.getElementById(id).addEventListener('input', update)); update();
</script></body></html>
