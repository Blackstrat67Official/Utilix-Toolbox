<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Secure Password Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #000000; --bg-container: #0a0a0a; --bg-element: #141414;
            --bg-hover: #1f1f1f; --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ededed; --text-secondary: #888888; --accent: #f28b82;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-body); color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; padding: 1.5rem;
        }
        .container {
            background: var(--bg-container); border: 1px solid var(--border); border-radius: 12px;
            width: 100%; max-width: 500px; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;
        }
        h2 { font-size: 1.1rem; font-weight: 500; text-align: center; }
        
        .output-box {
            background: var(--bg-element); border: 1px solid var(--border); border-radius: 8px;
            padding: 1rem; display: flex; justify-content: space-between; align-items: center;
        }
        .pwd-display {
            font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; color: var(--accent);
            word-break: break-all; margin-right: 1rem; font-weight: 500; letter-spacing: 1px;
        }
        .btn-icon {
            background: transparent; color: var(--text-primary); border: 1px solid var(--border);
            padding: 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s; display: flex;
        }
        .btn-icon:hover { background: var(--bg-hover); }
        
        .controls { display: flex; flex-direction: column; gap: 1.2rem; }
        
        .length-control { display: flex; flex-direction: column; gap: 8px; }
        .length-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary); }
        
        /* Custom Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: var(--accent); cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: var(--border); border-radius: 2px;
        }
        
        /* Checkboxes */
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
        .checkbox-group input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
        
        .btn-generate {
            background: var(--text-primary); color: var(--bg-body); border: none; padding: 12px;
            border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 10px;
        }
        .btn-generate:hover { background: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Generatore Password</h2>
        
        <div class="output-box">
            <div class="pwd-display" id="pwd-display">Seleziona opzioni...</div>
            <button class="btn-icon" onclick="copyPassword()" id="btn-copy" title="Copia">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
        </div>
        
        <div class="controls">
            <div class="length-control">
                <div class="length-header">
                    <span>Lunghezza</span>
                    <span id="length-val">16</span>
                </div>
                <input type="range" id="length-slider" min="8" max="64" value="16">
            </div>
            
            <div class="options">
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-upper" checked> Maiuscole (A-Z)
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-lower" checked> Minuscole (a-z)
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-num" checked> Numeri (0-9)
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-sym" checked> Simboli (!@#$)
                </label>
            </div>
            
            <button class="btn-generate" onclick="generatePassword()">Genera Nuova</button>
        </div>
    </div>
    
    <script>
        const slider = document.getElementById('length-slider');
        const lengthVal = document.getElementById('length-val');
        const display = document.getElementById('pwd-display');
        
        const chars = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            num: '0123456789',
            sym: '!@#$%^&*()_+~`|}{[]:;?><,./-='
        };

        slider.addEventListener('input', (e) => {
            lengthVal.innerText = e.target.value;
            generatePassword();
        });

        // Generazione sicura tramite Web Crypto API
        function generatePassword() {
            let charset = '';
            if(document.getElementById('chk-upper').checked) charset += chars.upper;
            if(document.getElementById('chk-lower').checked) charset += chars.lower;
            if(document.getElementById('chk-num').checked) charset += chars.num;
            if(document.getElementById('chk-sym').checked) charset += chars.sym;
            
            if(charset === '') {
                display.innerText = "Seleziona un'opzione!";
                return;
            }

            const length = parseInt(slider.value);
            let password = '';
            const randomValues = new Uint32Array(length);
            window.crypto.getRandomValues(randomValues);

            for (let i = 0; i < length; i++) {
                password += charset[randomValues[i] % charset.length];
            }
            
            display.innerText = password;
        }

        function copyPassword() {
            const pwd = display.innerText;
            if(pwd === "Seleziona un'opzione!") return;
            
            navigator.clipboard.writeText(pwd);
            
            // Feedback visivo sul bottone
            const btn = document.getElementById('btn-copy');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            btn.style.borderColor = "var(--accent)";
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.borderColor = "var(--border)";
            }, 1500);
        }

        // Add listeners to checkboxes to regenerate on toggle
        document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
            chk.addEventListener('change', generatePassword);
        });

        // Generate on load
        generatePassword();
    </script>
</body>
</html>
