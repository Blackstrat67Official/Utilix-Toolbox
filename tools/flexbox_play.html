<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Flexbox Play</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--accent:#ffd54f;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{display:flex;gap:15px;padding:1rem 1.5rem;background:#050505;border-bottom:1px solid var(--border);}
.box{display:flex;flex-direction:column;gap:5px;flex:1;} label{font-size:0.75rem;color:#aaa;}
select, input{background:#111;color:#fff;border:1px solid var(--border);padding:8px;border-radius:4px;outline:none;}
.preview{flex:1;background:#111;padding:1rem;display:flex;}
#flex-container{background:#1a1a1a;border:1px dashed #555;width:100%;height:100%;display:flex;}
.item{background:var(--accent);color:#000;padding:20px;font-weight:bold;border-radius:4px;font-size:1.5rem;display:flex;align-items:center;justify-content:center;}
.code{background:#000;padding:1rem 1.5rem;font-family:'JetBrains Mono',monospace;color:var(--accent);border-top:1px solid var(--border);white-space:pre;}
</style></head><body>
<div class="container">
    <div class="toolbar">
        <div class="box"><label>flex-direction</label><select id="fd"><option value="row">row</option><option value="column">column</option></select></div>
        <div class="box"><label>justify-content</label><select id="jc"><option value="flex-start">flex-start</option><option value="center">center</option><option value="space-between">space-between</option><option value="space-around">space-around</option></select></div>
        <div class="box"><label>align-items</label><select id="ai"><option value="stretch">stretch</option><option value="flex-start">flex-start</option><option value="center">center</option><option value="flex-end">flex-end</option></select></div>
        <div class="box"><label>gap (px)</label><input type="number" id="gap" value="10"></div>
    </div>
    <div class="preview"><div id="flex-container"><div class="item">1</div><div class="item" style="padding:30px">2</div><div class="item">3</div></div></div>
    <div class="code" id="code"></div>
</div>
<script>
    function update() {
        const fd=document.getElementById('fd').value, jc=document.getElementById('jc').value, ai=document.getElementById('ai').value, gap=document.getElementById('gap').value;
        const css = `display: flex;\nflex-direction: ${fd};\njustify-content: ${jc};\nalign-items: ${ai};\ngap: ${gap}px;`;
        document.getElementById('flex-container').style.cssText = css; document.getElementById('code').innerText = css;
    }
    ['fd','jc','ai','gap'].forEach(id => document.getElementById(id).addEventListener('input', update)); update();
</script></body></html>
