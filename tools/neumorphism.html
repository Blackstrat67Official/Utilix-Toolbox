<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Neumorphism</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-container:#2a2b2e;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#e0e0e0;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:#111;color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px;display:flex;overflow:hidden;}
.controls{width:300px;padding:1.5rem;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:15px;background:#1a1a1c;}
.preview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-container);}
.neu-box{width:200px;height:200px;border-radius:20px;background:var(--bg-container);}
label{font-size:0.8rem;color:#aaa;display:flex;justify-content:space-between;} input[type=range]{width:100%;accent-color:var(--accent);}
.code{width:100%;background:#000;padding:1.5rem;font-family:'JetBrains Mono',monospace;color:var(--accent);border-top:1px solid var(--border);text-align:center;}
</style></head><body>
<div class="container">
    <div class="controls">
        <div><label>Distanza <span id="v-d">10px</span></label><input type="range" id="d" min="1" max="50" value="10"></div>
        <div><label>Sfocatura <span id="v-b">20px</span></label><input type="range" id="b" min="0" max="100" value="20"></div>
        <div><label>Intensità <span id="v-i">0.15</span></label><input type="range" id="i" min="0.01" max="0.5" step="0.01" value="0.15"></div>
        <div><label style="margin-bottom:5px;">Forma</label>
            <select id="shape" style="width:100%;padding:8px;background:#000;color:#fff;border:1px solid var(--border);border-radius:4px;"><option value="flat">Piatto</option><option value="inset">Premuto (Inset)</option></select>
        </div>
    </div>
    <div class="preview">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%;"><div class="neu-box" id="box"></div></div>
        <div class="code" id="code"></div>
    </div>
</div>
<script>
    function update() {
        const d=document.getElementById('d').value, b=document.getElementById('b').value, i=document.getElementById('i').value, sh=document.getElementById('shape').value;
        document.getElementById('v-d').innerText=d+'px'; document.getElementById('v-b').innerText=b+'px'; document.getElementById('v-i').innerText=i;
        const ins = sh==='inset'?'inset ':''; const css = `border-radius: 20px;\nbackground: #2a2b2e;\nbox-shadow: ${ins}${d}px ${d}px ${b}px rgba(0,0,0,${(i*2).toFixed(2)}),\n            ${ins}-${d}px -${d}px ${b}px rgba(255,255,255,${i});`;
        document.getElementById('box').style.cssText = css; document.getElementById('code').innerText = css;
    }
    ['d','b','i','shape'].forEach(id => document.getElementById(id).addEventListener('input', update)); update();
</script></body></html>
