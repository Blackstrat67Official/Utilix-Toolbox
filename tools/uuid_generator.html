<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>UUID Generator</title>
    <style>
        body {
            background-color: #000; color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0;
        }
        .container {
            background: #080808; border: 1px solid #1f1f1f; padding: 2rem;
            border-radius: 12px; text-align: center; width: 90%; max-width: 450px;
        }
        h2 { margin-top: 0; font-size: 1.2rem; font-weight: 500; color: #e3e3e3; }
        .uuid-display {
            background: #111; padding: 1rem; border-radius: 8px;
            font-family: monospace; font-size: 1.2rem; margin: 1.5rem 0;
            border: 1px solid #222; letter-spacing: 1px; color: #8ab4f8;
        }
        button {
            background: #fff; color: #000; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
            transition: background 0.2s; margin: 0 5px;
        }
        button:hover { background: #ddd; }
        .btn-secondary { background: #1f1f1f; color: #fff; border: 1px solid #333; }
        .btn-secondary:hover { background: #2a2a2a; }
    </style>
</head>
<body>
    <div class="container">
        <h2>UUID v4 Generator</h2>
        <div class="uuid-display" id="uuid-output">Generazione...</div>
        <div>
            <button onclick="generate()">Rigenera</button>
            <button class="btn-secondary" onclick="copy()">Copia</button>
        </div>
    </div>
    
    <script>
        function generate() {
            // Metodo nativo moderno e sicuro per generare UUIDv4
            const uuid = window.crypto.randomUUID();
            document.getElementById('uuid-output').innerText = uuid;
        }
        
        function copy() {
            const text = document.getElementById('uuid-output').innerText;
            navigator.clipboard.writeText(text);
            const btn = document.querySelector('.btn-secondary');
            btn.innerText = "Copiato!";
            setTimeout(() => btn.innerText = "Copia", 1500);
        }
        
        // Genera subito un UUID all'apertura
        generate();
    </script>
</body>
</html>
