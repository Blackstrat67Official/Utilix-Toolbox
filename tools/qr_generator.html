<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>QR Maker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#e57373;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:800px;display:flex;flex-direction:column;overflow:hidden;}
.top{padding:1.5rem;border-bottom:1px solid var(--border);}
input{width:100%;background:#111;color:#fff;border:1px solid var(--border);padding:12px;border-radius:6px;outline:none;font-size:1rem;}
.preview{flex:1;display:flex;align-items:center;justify-content:center;background:#141414;flex-direction:column;gap:20px;}
#qr{background:#fff;padding:15px;border-radius:8px;}
</style></head><body>
<div class="container">
    <div class="top"><input type="text" id="in" placeholder="Incolla un URL o scrivi del testo qui..." value="https://google.com"></div>
    <div class="preview"><div id="qr"></div><div style="color:#888;font-size:0.8rem;">Scannerizza per provare</div></div>
</div>
<script>
    const qrDiv = document.getElementById('qr'); let qrcode = new QRCode(qrDiv, { width:200, height:200, colorDark:"#000000", colorLight:"#ffffff" });
    document.getElementById('in').addEventListener('input', (e) => {
        if(!e.target.value) { qrDiv.style.display = 'none'; return; }
        qrDiv.style.display = 'block'; qrcode.makeCode(e.target.value);
    });
    qrcode.makeCode("https://google.com");
</script></body></html>
