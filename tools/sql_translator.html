<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SQL Dialect Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #000000; --bg-container: #0a0a0a; --bg-element: #141414; --border: rgba(255, 255, 255, 0.08); --text-primary: #ededed; --accent: #64b5f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-body); color: var(--text-primary); font-family: system-ui, sans-serif; display: flex; justify-content: center; height: 100vh; padding: 1.5rem; }
        .container { background: var(--bg-container); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 1200px; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { padding: 1rem 1.5rem; background: var(--bg-element); border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 1rem; align-items: center; }
        select { background: var(--bg-body); color: var(--text-primary); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; outline: none; font-size: 0.9rem; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; flex-grow: 1; background: var(--border); }
        .panel { background: var(--bg-container); display: flex; flex-direction: column; }
        textarea { width: 100%; flex-grow: 1; background: transparent; color: var(--text-primary); border: none; padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; resize: none; outline: none; }
        textarea.output { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <select id="src"><option value="mysql">Da: MySQL</option><option value="postgres">Da: PostgreSQL</option><option value="sqlserver">Da: SQL Server</option></select>
            <span>➔</span>
            <select id="dst"><option value="postgres">A: PostgreSQL</option><option value="mysql">A: MySQL</option><option value="sqlserver">A: SQL Server</option></select>
        </div>
        <div class="editor-grid">
            <div class="panel"><textarea id="input" placeholder="Scrivi la query qui (es. SELECT * FROM `tabella` LIMIT 10)"></textarea></div>
            <div class="panel"><textarea id="output" class="output" readonly placeholder="Risultato tradotto (Tool Regex di Base)"></textarea></div>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const src = document.getElementById('src');
        const dst = document.getElementById('dst');

        function translate() {
            let sql = input.value;
            const s = src.value, d = dst.value;

            if (s === d) { output.value = sql; return; }

            // 1. Traduzione Virgolette
            if (s === 'mysql') sql = sql.replace(/`([^`]+)`/g, d === 'postgres' || d === 'sqlserver' ? '"$1"' : '`$1`');
            if (s === 'postgres' || s === 'sqlserver') sql = sql.replace(/"([^"]+)"/g, d === 'mysql' ? '`$1`' : '"$1"');

            // 2. LIMIT vs TOP
            if (d === 'sqlserver') {
                // Sostituisce LIMIT X con TOP X dopo SELECT
                sql = sql.replace(/\bLIMIT\s+(\d+)\b/gi, '');
                if (sql.match(/\bSELECT\b/i) && !sql.match(/\bTOP\b/i)) {
                    let limitMatch = input.value.match(/\bLIMIT\s+(\d+)\b/i);
                    if (limitMatch) sql = sql.replace(/\bSELECT\b/i, `SELECT TOP ${limitMatch[1]}`);
                }
            } else if (s === 'sqlserver') {
                // Sostituisce TOP X con LIMIT X alla fine
                let topMatch = sql.match(/\bTOP\s+(\d+)\b/i);
                if (topMatch) {
                    sql = sql.replace(/\bTOP\s+(\d+)\b/i, '');
                    sql = sql.trim() + ` LIMIT ${topMatch[1]}`;
                }
            }

            // 3. Auto Increment
            if (s === 'mysql' && d === 'postgres') sql = sql.replace(/\bAUTO_INCREMENT\b/gi, 'SERIAL');
            if (s === 'mysql' && d === 'sqlserver') sql = sql.replace(/\bAUTO_INCREMENT\b/gi, 'IDENTITY(1,1)');
            if (s === 'postgres' && d === 'mysql') sql = sql.replace(/\bSERIAL\b/gi, 'INT AUTO_INCREMENT');
            
            output.value = sql;
        }

        input.addEventListener('input', translate);
        src.addEventListener('change', translate);
        dst.addEventListener('change', translate);
    </script>
</body>
</html>
