<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>SVG Placeholder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#ba68c8;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px;display:flex;}
.controls{width:300px;padding:1.5rem;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:15px;}
input{background:#111;color:#fff;border:1px solid var(--border);padding:8px;border-radius:4px;width:100%;outline:none;}
.preview{flex:1;display:flex;flex-direction:column;}
.img-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#141414;overflow:hidden;}
textarea{height:100px;background:#000;color:var(--accent);border:none;border-top:1px solid var(--border);padding:1rem;font-family:'JetBrains Mono',monospace;resize:none;}
</style></head><body>
<div class="container">
    <div class="controls">
        <div><label style="font-size:0.8rem;color:#888;">Larghezza (px)</label><input type="number" id="w" value="800"></div>
        <div><label style="font-size:0.8rem;color:#888;">Altezza (px)</label><input type="number" id="h" value="600"></div>
        <div><label style="font-size:0.8rem;color:#888;">Colore Sfondo</label><input type="color" id="bg" value="#333333"></div>
        <div><label style="font-size:0.8rem;color:#888;">Testo</label><input type="text" id="txt" value="Placeholder"></div>
    </div>
    <div class="preview">
        <div class="img-wrap" id="img-wrap"></div>
        <textarea id="code" readonly></textarea>
    </div>
</div>
<script>
    function update() {
        const w=document.getElementById('w').value||800, h=document.getElementById('h').value||600, bg=document.getElementById('bg').value, txt=document.getElementById('txt').value;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <rect width="100%" height="100%" fill="${bg}"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffffff">${txt}</text>
</svg>`;
        document.getElementById('img-wrap').innerHTML = svg;
        document.getElementById('img-wrap').querySelector('svg').style.maxWidth = '100%';
        document.getElementById('img-wrap').querySelector('svg').style.maxHeight = '100%';
        document.getElementById('code').value = svg;
    }
    ['w','h','bg','txt'].forEach(id => document.getElementById(id).addEventListener('input', update)); update();
</script></body></html>
