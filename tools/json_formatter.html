<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            main: '#111111',
                            sidebar: '#171717',
                            hover: '#2a2a2a',
                            active: '#333333',
                            border: '#2e2e2e',
                            text: '#e5e5e5',
                            muted: '#888888'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-brand-text h-screen flex flex-col font-sans overflow-hidden">

    <!-- Toolbar -->
    <div class="h-16 bg-brand-sidebar border-b border-brand-border flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-4">
            <div class="flex flex-col">
                <h2 class="text-sm font-semibold text-white">JSON Formatter & Validator</h2>
                <span class="text-xs text-brand-muted">Incolla e formatta i tuoi dati JSON</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 mr-2">
                <label class="text-xs font-medium text-brand-muted uppercase tracking-wider">Indentazione</label>
                <select id="indent-select" class="bg-brand-main border border-brand-border text-white text-sm rounded-md px-3 py-1.5 focus:outline-none focus:border-indigo-500 transition-colors">
                    <option value="2">2 Spazi</option>
                    <option value="4">4 Spazi</option>
                    <option value="tab">Tab</option>
                    <option value="0">Minimizza (0 Spazi)</option>
                </select>
            </div>

            <button onclick="clearAll()" class="px-4 py-1.5 text-sm font-medium text-brand-muted hover:text-white bg-brand-main border border-brand-border rounded-md hover:bg-brand-hover transition-colors">
                Pulisci
            </button>
            <button onclick="formatJson()" class="px-4 py-1.5 text-sm font-medium text-brand-main bg-[#facc15] hover:bg-[#eab308] border border-transparent rounded-md transition-colors shadow-sm">
                Formatta JSON
            </button>
        </div>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="hidden bg-red-500/10 border-b border-red-500/20 px-6 py-2 flex items-center gap-2">
        <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="error-text" class="text-sm text-red-400 font-medium">Errore di validazione</span>
    </div>

    <!-- Editor Area -->
    <div class="flex-1 flex min-h-0 bg-brand-main">
        
        <!-- Input Panel -->
        <div class="w-1/2 flex flex-col border-r border-brand-border relative">
            <div class="absolute top-0 right-0 px-4 py-2 text-xs font-semibold text-brand-muted bg-brand-main/80 backdrop-blur-sm rounded-bl-lg z-10 pointer-events-none">
                INPUT
            </div>
            <div class="flex-1 flex w-full relative overflow-hidden">
                <div id="input-lines" class="w-12 pt-6 pb-6 pr-3 text-right bg-brand-sidebar/30 text-brand-muted/40 font-mono text-sm leading-6 border-r border-brand-border/50 select-none overflow-hidden whitespace-pre">1</div>
                <textarea 
                    id="input-json" 
                    class="flex-1 w-full p-6 pl-4 bg-transparent text-white font-mono text-sm leading-6 resize-none outline-none whitespace-pre placeholder-brand-muted/50 overflow-auto"
                    placeholder='Incolla qui il tuo JSON grezzo...&#10;&#10;Esempio:&#10;{"nome":"Mario","attivo":true,"ruoli":["admin","user"]}'
                    spellcheck="false"
                ></textarea>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="w-1/2 flex flex-col relative bg-[#0f0f0f]">
            <div class="absolute top-3 right-4 z-10 flex gap-2">
                <button onclick="copyOutput()" id="copy-btn" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-brand-muted hover:text-white bg-brand-sidebar border border-brand-border rounded-md hover:bg-brand-hover transition-colors shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copia
                </button>
            </div>
            <div class="flex-1 flex w-full relative overflow-hidden">
                <div id="output-lines" class="w-12 pt-6 pb-6 pr-3 text-right bg-brand-main/50 text-brand-muted/40 font-mono text-sm leading-6 border-r border-brand-border/50 select-none overflow-hidden whitespace-pre">1</div>
                <textarea 
                    id="output-json" 
                    readonly
                    class="flex-1 w-full p-6 pl-4 bg-transparent text-[#a9dc76] font-mono text-sm leading-6 resize-none outline-none whitespace-pre overflow-auto"
                    placeholder="Il JSON formattato apparirà qui..."
                    spellcheck="false"
                ></textarea>
            </div>
        </div>

    </div>

    <script>
        const inputEl = document.getElementById('input-json');
        const outputEl = document.getElementById('output-json');
        const inputLines = document.getElementById('input-lines');
        const outputLines = document.getElementById('output-lines');
        const indentSelect = document.getElementById('indent-select');
        const errorBanner = document.getElementById('error-banner');
        const errorText = document.getElementById('error-text');

        // Aggiorna i numeri di riga in base al contenuto
        function updateLineNumbers(textarea, linesEl) {
            const linesCount = textarea.value.split('\n').length || 1;
            linesEl.textContent = Array.from({length: linesCount}, (_, i) => i + 1).join('\n');
        }

        // Sincronizza lo scroll per allineare sempre testo e numeri
        inputEl.addEventListener('scroll', () => inputLines.scrollTop = inputEl.scrollTop);
        outputEl.addEventListener('scroll', () => outputLines.scrollTop = outputEl.scrollTop);

        // Formatta in automatico quando si incolla o si digita
        let timeout = null;
        inputEl.addEventListener('input', () => {
            updateLineNumbers(inputEl, inputLines);
            clearTimeout(timeout);
            timeout = setTimeout(formatJson, 400); // Debounce
        });

        // Formatta quando si cambia il livello di indentazione
        indentSelect.addEventListener('change', formatJson);

        function formatJson() {
            const rawValue = inputEl.value.trim();
            
            if (!rawValue) {
                outputEl.value = '';
                updateLineNumbers(outputEl, outputLines);
                hideError();
                return;
            }

            try {
                // Parsing
                const parsedData = JSON.parse(rawValue);
                
                // Indentazione
                const indentSetting = indentSelect.value;
                let space = 2; // Default
                
                if (indentSetting === '4') space = 4;
                else if (indentSetting === 'tab') space = '\t';
                else if (indentSetting === '0') space = 0;

                // Formattazione
                const formattedJson = JSON.stringify(parsedData, null, space);
                
                outputEl.value = formattedJson;
                updateLineNumbers(outputEl, outputLines);
                outputEl.classList.remove('text-red-400');
                outputEl.classList.add('text-[#a9dc76]');
                hideError();

            } catch (error) {
                // Gestione Errore
                outputEl.value = error.message;
                updateLineNumbers(outputEl, outputLines);
                outputEl.classList.remove('text-[#a9dc76]');
                outputEl.classList.add('text-red-400');
                showError(error.message);
            }
        }

        function clearAll() {
            inputEl.value = '';
            outputEl.value = '';
            updateLineNumbers(inputEl, inputLines);
            updateLineNumbers(outputEl, outputLines);
            hideError();
            inputEl.focus();
        }

        function copyOutput() {
            if (!outputEl.value || outputEl.classList.contains('text-red-400')) return;
            
            navigator.clipboard.writeText(outputEl.value);
            
            const btn = document.getElementById('copy-btn');
            const originalHtml = btn.innerHTML;
            
            btn.innerHTML = `<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copiato`;
            btn.classList.add('border-emerald-500/50', 'bg-emerald-500/10');
            
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('border-emerald-500/50', 'bg-emerald-500/10');
            }, 2000);
        }

        function showError(message) {
            errorText.textContent = "JSON Non Valido: " + message;
            errorBanner.classList.remove('hidden');
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }
    </script>
</body>
</html>
