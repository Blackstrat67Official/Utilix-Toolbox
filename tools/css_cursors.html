<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>CSS Cursors</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--accent:#90caf9;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px;display:flex;flex-direction:column;overflow:hidden;}
.header{padding:1.5rem;border-bottom:1px solid var(--border);text-align:center;} .header p{color:#888;font-size:0.85rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:15px;padding:1.5rem;overflow-y:auto;flex:1;}
.cur-box{background:#111;border:1px solid var(--border);border-radius:6px;height:80px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--accent);transition:background 0.2s;}
.cur-box:hover{background:#222;}
</style></head><body>
<div class="container">
    <div class="header"><h2>CSS Cursors</h2><p>Passa il mouse sui riquadri per testare. Clicca per copiare.</p></div>
    <div class="grid" id="grid"></div>
</div>
<script>
    const cursors = ['alias','all-scroll','auto','cell','context-menu','col-resize','copy','crosshair','default','e-resize','ew-resize','grab','grabbing','help','move','n-resize','ne-resize','nesw-resize','ns-resize','nw-resize','nwse-resize','no-drop','none','not-allowed','pointer','progress','row-resize','s-resize','se-resize','sw-resize','text','w-resize','wait','zoom-in','zoom-out'];
    const grid = document.getElementById('grid');
    cursors.forEach(c => {
        const div = document.createElement('div'); div.className = 'cur-box'; div.style.cursor = c; div.innerText = c;
        div.onclick = () => { navigator.clipboard.writeText(`cursor: ${c};`); const orig = div.innerText; div.innerText = 'Copiato!'; setTimeout(()=>div.innerText=orig, 1000); };
        grid.appendChild(div);
    });
</script></body></html>
