<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>CSV to SQL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #000000; --bg-container: #0a0a0a; --bg-element: #141414;
            --bg-hover: #1f1f1f; --border: rgba(255, 255, 255, 0.08); 
            --text-primary: #ededed; --text-secondary: #888888; --accent: #4db6ac; --error: #ff5252;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
        body {
            background-color: var(--bg-body); color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; height: 100vh; padding: 1.5rem;
        }
        .container { background: var(--bg-container); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 1200px; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        h2 { font-size: 1rem; font-weight: 500; }
        .toolbar { padding: 0.75rem 1.5rem; background: var(--bg-element); border-bottom: 1px solid var(--border); display: flex; gap: 1rem; align-items: center; }
        .input-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .input-field { background: var(--bg-body); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 8px; border-radius: 4px; outline: none; font-family: 'JetBrains Mono', monospace; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; flex-grow: 1; background: var(--border); }
        .panel { background: var(--bg-container); display: flex; flex-direction: column; }
        .panel-header { padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); display: flex; justify-content: space-between; }
        textarea { width: 100%; flex-grow: 1; background: transparent; color: var(--text-primary); border: none; padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; resize: none; outline: none; white-space: pre; }
        textarea.output { color: var(--accent); }
        .btn-action { background: var(--bg-element); color: var(--text-primary); border: 1px solid var(--border); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
        .btn-action:hover { background: var(--bg-hover); }
        .error-bar { background: rgba(255, 82, 82, 0.1); color: var(--error); padding: 8px 1.5rem; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>CSV / Excel to SQL</h2>
            <button class="btn-action" onclick="clearAll()">Pulisci</button>
        </div>
        <div class="toolbar">
            <div class="input-group">
                <label>Nome Tabella:</label>
                <input type="text" id="table-name" class="input-field" value="mia_tabella">
            </div>
            <button class="btn-action" onclick="generateSQL()" style="background: var(--text-primary); color: var(--bg-body);">Genera SQL</button>
        </div>
        <div class="error-bar" id="error-bar"></div>
        <div class="editor-grid">
            <div class="panel">
                <div class="panel-header">Input (Incolla CSV o da Excel)</div>
                <textarea id="input-csv" placeholder="id,nome,eta,attivo&#10;1,Mario,30,true&#10;2,Luigi,25,false"></textarea>
            </div>
            <div class="panel">
                <div class="panel-header">Output SQL <button class="btn-action" id="copy-btn" onclick="copyOutput()">Copia</button></div>
                <textarea id="output-sql" class="output" readonly></textarea>
            </div>
        </div>
    </div>
    <script>
        function guessType(value) {
            if (!value) return 'VARCHAR(255)';
            if (!isNaN(value) && value.trim() !== '') return value.includes('.') ? 'DECIMAL(10,2)' : 'INT';
            if (value.toLowerCase() === 'true' || value.toLowerCase() === 'false') return 'BOOLEAN';
            if (!isNaN(Date.parse(value)) && value.length > 8) return 'DATE';
            return 'VARCHAR(255)';
        }

        function generateSQL() {
            const raw = document.getElementById('input-csv').value.trim();
            const tableName = document.getElementById('table-name').value.trim() || 'table_name';
            const err = document.getElementById('error-bar');
            
            if (!raw) { err.style.display = 'none'; return; }

            // Separa righe (gestisce in modo basico CSV e copia-incolla Excel tramite tab)
            const rows = raw.split(/\r?\n/);
            if (rows.length < 2) {
                err.innerText = "Inserisci almeno un'intestazione e una riga di dati.";
                err.style.display = 'block'; return;
            }
            err.style.display = 'none';

            const separator = rows[0].includes('\t') ? '\t' : ',';
            const headers = rows[0].split(separator).map(h => h.trim().replace(/[^a-zA-Z0-9_]/g, '_'));
            const dataRows = rows.slice(1).map(r => r.split(separator).map(c => c.trim()));

            // Indovina tipi di dato dalla prima riga di dati valida
            const types = headers.map((_, i) => guessType(dataRows[0][i]));

            let sql = `-- Creazione Tabella\nCREATE TABLE ${tableName} (\n`;
            headers.forEach((h, i) => {
                sql += `    ${h} ${types[i]}${i < headers.length - 1 ? ',' : ''}\n`;
            });
            sql += `);\n\n-- Inserimento Dati\n`;

            dataRows.forEach(row => {
                if (row.length !== headers.length) return; // Salta righe malformate
                const values = row.map(v => {
                    if (!v) return 'NULL';
                    if (!isNaN(v) && v !== '') return v; // Numeri
                    if (v.toLowerCase() === 'true' || v.toLowerCase() === 'false') return v.toUpperCase();
                    return `'${v.replace(/'/g, "''")}'`; // Escaping singole virgolette
                });
                sql += `INSERT INTO ${tableName} (${headers.join(', ')}) VALUES (${values.join(', ')});\n`;
            });

            document.getElementById('output-sql').value = sql;
        }

        function clearAll() { document.getElementById('input-csv').value = ''; document.getElementById('output-sql').value = ''; }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('output-sql').value); const b=document.getElementById('copy-btn'); b.innerText="Copiato!"; setTimeout(()=>b.innerText="Copia",1500); }
    </script>
</body>
</html>
