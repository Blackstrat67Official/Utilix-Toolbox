<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Base64</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--bg-element:#141414;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#aed581;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1000px;display:flex;flex-direction:column;}
.toolbar{padding:1rem;border-bottom:1px solid var(--border);display:flex;gap:10px;}
select{background:var(--bg-body);color:var(--text-primary);border:1px solid var(--border);padding:6px 12px;border-radius:6px;}
.grid{display:grid;grid-template-columns:1fr 1fr;flex-grow:1;}
textarea{background:transparent;color:var(--accent);border:none;padding:1.5rem;font-family:'JetBrains Mono',monospace;resize:none;outline:none;}
.left{border-right:1px solid var(--border);color:var(--text-primary);}
</style></head><body>
<div class="container">
    <div class="toolbar">
        <select id="mode"><option value="enc">Testo ➔ Base64 (Encode)</option><option value="dec">Base64 ➔ Testo (Decode)</option></select>
    </div>
    <div class="grid">
        <textarea id="in" class="left" placeholder="Input..."></textarea>
        <textarea id="out" readonly placeholder="Output..."></textarea>
    </div>
</div>
<script>
    const i=document.getElementById('in'), o=document.getElementById('out'), m=document.getElementById('mode');
    function convert() {
        try { o.value = m.value==='enc' ? btoa(unescape(encodeURIComponent(i.value))) : decodeURIComponent(escape(atob(i.value)));
        } catch(e) { o.value = "Errore di conversione (Input non valido)"; }
    }
    i.addEventListener('input', convert); m.addEventListener('change', convert);
</script></body></html>
