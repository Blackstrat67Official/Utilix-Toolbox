<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art & Matrix Banner Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            main: '#0a0a0a',
                            panel: '#121212',
                            card: '#181818',
                            hover: '#242424',
                            border: '#262626',
                            text: '#ededed',
                            muted: '#888888'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #333 transparent; }
        .material-symbols-outlined { font-size: 18px; vertical-align: middle; }
    </style>
</head>
<body class="bg-brand-main text-brand-text h-screen flex flex-col font-sans overflow-hidden">

    <!-- HEADER -->
    <header class="h-16 bg-brand-panel border-b border-brand-border px-5 flex items-center justify-between gap-4 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-lime-500/10 border border-lime-500/30 flex items-center justify-center text-lime-400">
                <span class="material-symbols-outlined text-[20px]">terminal</span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-sm font-semibold text-white">ASCII Art & Matrix Studio</h1>
                    <span class="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded bg-lime-500/15 text-lime-400 border border-lime-500/30">Banner & Image Engine</span>
                </div>
                <p class="text-[11px] text-brand-muted">Genera banner ASCII per codice/CLI o converti immagini e pattern procedurali</p>
            </div>
        </div>

        <!-- Mode Switcher -->
        <div class="flex items-center bg-black p-1 rounded-lg border border-brand-border">
            <button onclick="switchMode('banner')" id="tab-banner" class="px-3.5 py-1.5 rounded text-xs font-semibold bg-brand-card text-lime-400 transition-colors flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[16px]">title</span>
                <span>Text Banner CLI</span>
            </button>
            <button onclick="switchMode('image')" id="tab-image" class="px-3.5 py-1.5 rounded text-xs font-semibold text-brand-muted hover:text-white transition-colors flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[16px]">Filter_hdr</span>
                <span>Immagine / Seed ➔ ASCII</span>
            </button>
        </div>

        <!-- Copy Action -->
        <div class="flex items-center gap-2">
            <button onclick="copyAsciiOutput()" id="btn-copy" class="px-4 py-2 bg-lime-500 hover:bg-lime-400 text-black font-semibold text-xs rounded-lg flex items-center gap-1.5 transition-all">
                <span class="material-symbols-outlined text-[17px]">content_copy</span>
                <span>Copia ASCII</span>
            </button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="flex-1 flex min-h-0 overflow-hidden">
        
        <!-- LEFT SIDEBAR -->
        <aside class="w-80 bg-brand-panel border-r border-brand-border p-5 flex flex-col gap-4 overflow-y-auto shrink-0">
            
            <!-- CONTROLLI MODALITÀ BANNER TESTO -->
            <div id="controls-banner" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-brand-muted block mb-1.5">Testo Banner</label>
                    <input id="banner-text" type="text" value="STRAT OS" maxlength="18" oninput="renderAscii()" class="w-full bg-black border border-brand-border rounded-lg px-3 py-2 text-sm font-mono text-lime-400 focus:outline-none focus:border-lime-500">
                </div>

                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-brand-muted block mb-1.5">Stile Caratteri</label>
                    <select id="banner-font" onchange="renderAscii()" class="w-full bg-brand-card border border-brand-border rounded-lg px-3 py-2 text-xs text-white outline-none">
                        <option value="block">█▓▒░ Cyber Block Heavy</option>
                        <option value="shadow">╔══╗ Isometric Shadow</option>
                        <option value="matrix">0101 Matrix Binary</option>
                        <option value="retro">#### Classic Hash</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-brand-muted block mb-1.5">Cornice & Commento Codice</label>
                    <select id="banner-frame" onchange="renderAscii()" class="w-full bg-brand-card border border-brand-border rounded-lg px-3 py-2 text-xs text-white outline-none">
                        <option value="none">Nessuna Cornice</option>
                        <option value="double">╔═══╗ Box Doppio</option>
                        <option value="js">/* ... */ Commento JS / C / CSS</option>
                        <option value="py"># === Commento Python / Bash</option>
                        <option value="sql">-- === Commento SQL</option>
                    </select>
                </div>
            </div>

            <!-- CONTROLLI MODALITÀ IMMAGINE / SEED -->
            <div id="controls-image" class="hidden space-y-4">
                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-brand-muted block mb-1.5">Carica Immagine Locale</label>
                    <input id="img-upload" type="file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-brand-muted file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-lime-500/15 file:text-lime-400 hover:file:bg-lime-500/25 cursor-pointer">
                </div>

                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-brand-muted block mb-1.5">Oppure Seed Procedurale</label>
                    <div class="flex gap-1.5">
                        <input id="art-seed" type="text" value="GALAXY-42" oninput="renderAscii()" class="flex-1 bg-black border border-brand-border rounded-lg px-3 py-1.5 text-xs font-mono text-lime-400 outline-none">
                        <button onclick="useProceduralSeed()" class="px-2.5 py-1.5 bg-brand-card hover:bg-brand-hover border border-brand-border rounded-lg text-xs text-white">Seed</button>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-brand-muted">Larghezza Colonne</span>
                        <span id="lbl-cols" class="font-mono text-lime-400">90 ch</span>
                    </div>
                    <input id="ascii-cols" type="range" min="40" max="150" value="90" oninput="renderAscii()" class="w-full accent-lime-500">
                </div>

                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-brand-muted block mb-1.5">Set di Caratteri (Densità)</label>
                    <select id="char-ramp" onchange="renderAscii()" class="w-full bg-brand-card border border-brand-border rounded-lg px-3 py-2 text-xs text-white outline-none font-mono">
                        <option value="standard">@%#*+=-:. (Classico)</option>
                        <option value="blocks">█▓▒░  (Blocchi ANSI)</option>
                        <option value="matrix">01 (Binario Matrix)</option>
                        <option value="minimal">#+.  (Minimale)</option>
                    </select>
                </div>
            </div>

            <hr class="border-brand-border">

            <div>
                <label class="text-xs font-semibold uppercase tracking-wider text-brand-muted block mb-1.5">Colore Terminale</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setTerminalColor('#a3e635')" class="h-7 rounded bg-lime-400 border border-white/20"></button>
                    <button onclick="setTerminalColor('#fbbf24')" class="h-7 rounded bg-amber-400 border border-white/20"></button>
                    <button onclick="setTerminalColor('#38bdf8')" class="h-7 rounded bg-sky-400 border border-white/20"></button>
                    <button onclick="setTerminalColor('#ffffff')" class="h-7 rounded bg-white border border-white/20"></button>
                </div>
            </div>

        </aside>

        <!-- OUTPUT TERMINAL -->
        <main class="flex-1 bg-[#050505] p-6 flex flex-col overflow-hidden">
            <div class="flex-1 bg-black border border-brand-border rounded-xl p-6 overflow-auto flex items-start justify-start">
                <pre id="ascii-output" class="font-mono text-[11px] leading-[1.15] text-lime-400 select-all whitespace-pre"></pre>
            </div>
        </main>
    </div>

    <canvas id="hidden-canvas" class="hidden"></canvas>

    <script>
        let currentMode = 'banner';
        let uploadedImage = null;

        // Font bitmap 5x5 compatto per generazione istantanea
        const BITMAP_FONT = {
            'A': [" 111 ","1   1","11111","1   1","1   1"],
            'B': ["1111 ","1   1","1111 ","1   1","1111 "],
            'C': [" 1111","1    ","1    ","1    "," 1111"],
            'D': ["1111 ","1   1","1   1","1   1","1111 "],
            'E': ["11111","1    ","1111 ","1    ","11111"],
            'F': ["11111","1    ","1111 ","1    ","1    "],
            'G': [" 1111","1    ","1  11","1   1"," 1111"],
            'H': ["1   1","1   1","11111","1   1","1   1"],
            'I': ["11111","  1  ","  1  ","  1  ","11111"],
            'J': ["  111","    1","    1","1   1"," 111 "],
            'K': ["1   1","1  1 ","111  ","1  1 ","1   1"],
            'L': ["1    ","1    ","1    ","1    ","11111"],
            'M': ["1   1","11 11","1 1 1","1   1","1   1"],
            'N': ["1   1","11  1","1 1 1","1  11","1   1"],
            'O': [" 111 ","1   1","1   1","1   1"," 111 "],
            'P': ["1111 ","1   1","1111 ","1    ","1    "],
            'Q': [" 111 ","1   1","1 1 1","1  1 "," 11 1"],
            'R': ["1111 ","1   1","1111 ","1  1 ","1   1"],
            'S': [" 1111","1    "," 111 ","    1","1111 "],
            'T': ["11111","  1  ","  1  ","  1  ","  1  "],
            'U': ["1   1","1   1","1   1","1   1"," 111 "],
            'V': ["1   1","1   1","1   1"," 1 1 ","  1  "],
            'W': ["1   1","1   1","1 1 1","11 11","1   1"],
            'X': ["1   1"," 1 1 ","  1  "," 1 1 ","1   1"],
            'Y': ["1   1"," 1 1 ","  1  ","  1  ","  1  "],
            'Z': ["11111","   1 ","  1  "," 1   ","11111"],
            '0': [" 111 ","1  11","1 1 1","11  1"," 111 "],
            '1': ["  1  "," 11  ","  1  ","  1  ","11111"],
            '2': [" 111 ","1   1","  11 "," 1   ","11111"],
            '3': ["1111 ","    1"," 111 ","    1","1111 "],
            '4': ["1  1 ","1  1 ","11111","   1 ","   1 "],
            '5': ["11111","1    ","1111 ","    1","1111 "],
            '6': [" 111 ","1    ","1111 ","1   1"," 111 "],
            '7': ["11111","    1","   1 ","  1  ","  1  "],
            '8': [" 111 ","1   1"," 111 ","1   1"," 111 "],
            '9': [" 111 ","1   1"," 1111","    1"," 111 "],
            '-': ["     ","     ","11111","     ","     "],
            ' ': ["   ","   ","   ","   ","   "]
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('controls-banner').classList.toggle('hidden', mode !== 'banner');
            document.getElementById('controls-image').classList.toggle('hidden', mode !== 'image');

            document.getElementById('tab-banner').className = mode === 'banner'
                ? 'px-3.5 py-1.5 rounded text-xs font-semibold bg-brand-card text-lime-400 transition-colors flex items-center gap-1.5'
                : 'px-3.5 py-1.5 rounded text-xs font-semibold text-brand-muted hover:text-white transition-colors flex items-center gap-1.5';
            document.getElementById('tab-image').className = mode === 'image'
                ? 'px-3.5 py-1.5 rounded text-xs font-semibold bg-brand-card text-lime-400 transition-colors flex items-center gap-1.5'
                : 'px-3.5 py-1.5 rounded text-xs font-semibold text-brand-muted hover:text-white transition-colors flex items-center gap-1.5';

            renderAscii();
        }

        function generateTextBanner() {
            const text = (document.getElementById('banner-text').value || 'STRAT').toUpperCase();
            const fontStyle = document.getElementById('banner-font').value;
            const frame = document.getElementById('banner-frame').value;

            const rows = ["", "", "", "", ""];
            for (const ch of text) {
                const glyph = BITMAP_FONT[ch] || BITMAP_FONT[' '];
                for (let r = 0; r < 5; r++) {
                    let line = '';
                    for (const bit of glyph[r]) {
                        if (bit === '1') {
                            if (fontStyle === 'block') line += '██';
                            else if (fontStyle === 'shadow') line += '▓▓';
                            else if (fontStyle === 'matrix') line += (r % 2 === 0 ? '10' : '01');
                            else line += '##';
                        } else {
                            line += fontStyle === 'shadow' ? '░░' : '  ';
                        }
                    }
                    rows[r] += line + '  ';
                }
            }

            const width = rows[0].length;
            if (frame === 'double') {
                const border = '═'.repeat(width + 2);
                return `╔${border}╗\n` + rows.map(r => `║ ${r} ║`).join('\n') + `\n╚${border}╝`;
            } else if (frame === 'js') {
                const stars = '*'.repeat(width + 4);
                return `/${stars}\n` + rows.map(r => ` *  ${r} *`).join('\n') + `\n ${stars}/`;
            } else if (frame === 'py') {
                const eq = '='.repeat(width + 2);
                return `# ${eq}\n` + rows.map(r => `#  ${r}`).join('\n') + `\n# ${eq}`;
            } else if (frame === 'sql') {
                const dash = '-'.repeat(width + 2);
                return `-- ${dash}\n` + rows.map(r => `--  ${r}`).join('\n') + `\n-- ${dash}`;
            }
            return rows.join('\n');
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    renderAscii();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function useProceduralSeed() {
            uploadedImage = null;
            renderAscii();
        }

        function generateImageOrSeedAscii() {
            const cols = parseInt(document.getElementById('ascii-cols').value, 10);
            document.getElementById('lbl-cols').textContent = `${cols} ch`;
            const rampType = document.getElementById('char-ramp').value;

            const ramps = {
                standard: '@%#*+=-:. ',
                blocks: '█▓▒░ ',
                matrix: '01 ',
                minimal: '#+. '
            };
            const ramp = ramps[rampType] || ramps.standard;

            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            const rows = Math.floor(cols * 0.48);
            canvas.width = cols;
            canvas.height = rows;

            if (uploadedImage) {
                ctx.drawImage(uploadedImage, 0, 0, cols, rows);
            } else {
                // Disegna un vortice/pianeta procedurale dal seed
                const seed = document.getElementById('art-seed').value || 'GALAXY';
                let h = 2166136261;
                for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
                const freq = 0.08 + ((h >>> 0) % 100) / 800;
                const arms = 2 + ((h >>> 0) % 5);

                const imgData = ctx.createImageData(cols, rows);
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const dx = (x - cols / 2) / (cols / 2);
                        const dy = (y - rows / 2) / (rows / 2);
                        const dist = Math.hypot(dx, dy);
                        const angle = Math.atan2(dy, dx);
                        const val = (Math.sin(dist * 10 - angle * arms + (h % 7)) * 0.5 + 0.5) * Math.max(0, 1 - dist * 0.85);
                        const c = Math.floor(val * 255);
                        const idx = (y * cols + x) * 4;
                        imgData.data[idx] = c;
                        imgData.data[idx + 1] = c;
                        imgData.data[idx + 2] = c;
                        imgData.data[idx + 3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }

            const pixels = ctx.getImageData(0, 0, cols, rows).data;
            let out = '';
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const i = (y * cols + x) * 4;
                    const lum = (0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2]) / 255;
                    const charIdx = Math.min(ramp.length - 1, Math.floor((1 - lum) * ramp.length));
                    out += ramp[charIdx];
                }
                out += '\n';
            }
            return out;
        }

        function renderAscii() {
            const outputEl = document.getElementById('ascii-output');
            if (currentMode === 'banner') {
                outputEl.textContent = generateTextBanner();
            } else {
                outputEl.textContent = generateImageOrSeedAscii();
            }
        }

        function setTerminalColor(hex) {
            document.getElementById('ascii-output').style.color = hex;
        }

        function copyAsciiOutput() {
            const text = document.getElementById('ascii-output').textContent;
            navigator.clipboard.writeText(text);
            const btn = document.getElementById('btn-copy');
            const orig = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined text-[17px]">check</span><span>Copiato!</span>`;
            setTimeout(() => btn.innerHTML = orig, 1500);
        }

        window.addEventListener('DOMContentLoaded', renderAscii);
    </script>
</body>
</html>
