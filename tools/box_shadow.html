<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Box Shadow</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#f06292;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:900px;display:flex;}
.controls{width:350px;padding:1.5rem;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:15px;overflow-y:auto;}
.preview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#141414;position:relative;}
.box{width:200px;height:200px;background:#f06292;border-radius:12px;transition:box-shadow 0.1s;}
label{font-size:0.8rem;color:#888;display:flex;justify-content:space-between;}
input[type=range]{width:100%;accent-color:var(--accent);}
.code{position:absolute;bottom:0;width:100%;background:#000;padding:1rem;font-family:'JetBrains Mono',monospace;color:var(--accent);border-top:1px solid var(--border);text-align:center;font-size:0.85rem;}
</style></head><body>
<div class="container">
    <div class="controls">
        <div><label>Offset X <span id="vx">0px</span></label><input type="range" id="x" min="-50" max="50" value="0"></div>
        <div><label>Offset Y <span id="vy">10px</span></label><input type="range" id="y" min="-50" max="50" value="10"></div>
        <div><label>Blur <span id="vb">20px</span></label><input type="range" id="b" min="0" max="100" value="20"></div>
        <div><label>Spread <span id="vs">0px</span></label><input type="range" id="s" min="-50" max="50" value="0"></div>
        <div><label>Opacità <span id="vo">0.5</span></label><input type="range" id="o" min="0" max="1" step="0.05" value="0.5"></div>
    </div>
    <div class="preview">
        <div class="box" id="box"></div>
        <div class="code" id="code">box-shadow: 0px 10px 20px 0px rgba(0,0,0,0.5);</div>
    </div>
</div>
<script>
    function update() {
        const x=document.getElementById('x').value, y=document.getElementById('y').value, b=document.getElementById('b').value, s=document.getElementById('s').value, o=document.getElementById('o').value;
        document.getElementById('vx').innerText=x+'px'; document.getElementById('vy').innerText=y+'px'; document.getElementById('vb').innerText=b+'px'; document.getElementById('vs').innerText=s+'px'; document.getElementById('vo').innerText=o;
        const css = `${x}px ${y}px ${b}px ${s}px rgba(0,0,0,${o})`;
        document.getElementById('box').style.boxShadow = css;
        document.getElementById('code').innerText = `box-shadow: ${css};`;
    }
    ['x','y','b','s','o'].forEach(id => document.getElementById(id).addEventListener('input', update)); update();
</script></body></html>
