<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Diff Checker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Libreria ultra-leggera per diff (Google Diff Match Patch wrapper) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
<style>
:root{--bg-body:#000;--bg-container:#0a0a0a;--border:rgba(255,255,255,0.08);--text-primary:#ededed;--accent:#e57373;}
*{margin:0;padding:0;box-sizing:border-box;} body{background:var(--bg-body);color:var(--text-primary);font-family:system-ui,sans-serif;display:flex;justify-content:center;height:100vh;padding:1.5rem;}
.container{background:var(--bg-container);border:1px solid var(--border);border-radius:12px;width:100%;max-width:1200px;display:flex;flex-direction:column;overflow:hidden;}
.header{padding:1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
button{background:var(--text-primary);color:#000;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;}
.grid{display:grid;grid-template-columns:1fr 1fr;height:40%;border-bottom:1px solid var(--border);}
textarea{background:transparent;color:#aaa;border:none;padding:1rem;font-family:'JetBrains Mono',monospace;font-size:0.85rem;resize:none;outline:none;}
.left{border-right:1px solid var(--border);}
.output{height:60%;background:#111;overflow-y:auto;padding:1rem;font-family:'JetBrains Mono',monospace;font-size:0.85rem;white-space:pre-wrap;}
.add{background:rgba(76,175,80,0.2);color:#81c995;} .del{background:rgba(244,67,54,0.2);color:#e57373;}
</style></head><body>
<div class="container">
    <div class="header"><h2>Diff Checker</h2> <button onclick="compare()">Compara</button></div>
    <div class="grid">
        <textarea id="t1" class="left" placeholder="Testo Originale..."></textarea>
        <textarea id="t2" placeholder="Testo Modificato..."></textarea>
    </div>
    <div class="output" id="out"><span style="color:#555">Il risultato apparirà qui...</span></div>
</div>
<script>
    function compare() {
        const t1=document.getElementById('t1').value, t2=document.getElementById('t2').value;
        const diff = Diff.diffLines(t1, t2); // Usa jsdiff
        const out = document.getElementById('out'); out.innerHTML = '';
        diff.forEach((part) => {
            const colorClass = part.added ? 'add' : part.removed ? 'del' : '';
            const span = document.createElement('span');
            span.className = colorClass; span.appendChild(document.createTextNode(part.value));
            out.appendChild(span);
        });
    }
</script></body></html>
