<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Case Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #000000; --bg-container: #0a0a0a; --bg-element: #141414;
            --bg-hover: #1f1f1f; --border: rgba(255, 255, 255, 0.08); --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #ededed; --text-secondary: #888888; --accent: #64b5f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
        body {
            background-color: var(--bg-body); color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: stretch; height: 100vh; padding: 1.5rem;
        }
        .container {
            background: var(--bg-container); border: 1px solid var(--border); border-radius: 12px;
            width: 100%; max-width: 800px; display: flex; flex-direction: column; overflow: hidden;
        }
        .header { display: flex; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        h2 { font-size: 1rem; font-weight: 500; }
        .main-input {
            width: 100%; min-height: 120px; background: transparent; color: var(--text-primary);
            border: none; border-bottom: 1px solid var(--border); padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; resize: none; outline: none;
        }
        .main-input::placeholder { color: #444; }
        .results-list { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
        .result-item { display: flex; flex-direction: column; gap: 4px; }
        .result-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        .result-output-wrapper { display: flex; gap: 8px; }
        .result-output {
            flex-grow: 1; background: var(--bg-element); color: var(--accent);
            border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; outline: none; user-select: all;
        }
        .btn-copy {
            background: var(--bg-element); color: var(--text-primary); border: 1px solid var(--border);
            padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: all 0.15s;
        }
        .btn-copy:hover { background: var(--bg-hover); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h2>Case Converter</h2></div>
        <textarea id="text-input" class="main-input" placeholder="Scrivi una frase, es: ciao mondo crudele..."></textarea>
        
        <div class="results-list">
            <div class="result-item">
                <span class="result-label">camelCase</span>
                <div class="result-output-wrapper">
                    <input type="text" id="camel" class="result-output" readonly>
                    <button class="btn-copy" onclick="copyCase('camel', this)">Copia</button>
                </div>
            </div>
            <div class="result-item">
                <span class="result-label">PascalCase</span>
                <div class="result-output-wrapper">
                    <input type="text" id="pascal" class="result-output" readonly>
                    <button class="btn-copy" onclick="copyCase('pascal', this)">Copia</button>
                </div>
            </div>
            <div class="result-item">
                <span class="result-label">snake_case</span>
                <div class="result-output-wrapper">
                    <input type="text" id="snake" class="result-output" readonly>
                    <button class="btn-copy" onclick="copyCase('snake', this)">Copia</button>
                </div>
            </div>
            <div class="result-item">
                <span class="result-label">kebab-case</span>
                <div class="result-output-wrapper">
                    <input type="text" id="kebab" class="result-output" readonly>
                    <button class="btn-copy" onclick="copyCase('kebab', this)">Copia</button>
                </div>
            </div>
            <div class="result-item">
                <span class="result-label">CONSTANT_CASE</span>
                <div class="result-output-wrapper">
                    <input type="text" id="constant" class="result-output" readonly>
                    <button class="btn-copy" onclick="copyCase('constant', this)">Copia</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const input = document.getElementById('text-input');
        const outputs = {
            camel: document.getElementById('camel'),
            pascal: document.getElementById('pascal'),
            snake: document.getElementById('snake'),
            kebab: document.getElementById('kebab'),
            constant: document.getElementById('constant')
        };

        // Funzione per dividere il testo in parole (gestisce spazi, underscore, trattini e maiuscole)
        function getWords(str) {
            // Regex che divide per spazi, underscore, hyphens, oppure prima delle lettere maiuscole
            return str.trim().split(/[\s_-]+|(?=[A-Z])/).filter(Boolean).map(w => w.toLowerCase());
        }

        input.addEventListener('input', () => {
            const txt = input.value;
            if (!txt) {
                Object.values(outputs).forEach(el => el.value = "");
                return;
            }

            const words = getWords(txt);
            if (words.length === 0) return;

            outputs.camel.value = words.map((w, i) => i === 0 ? w : w[0].toUpperCase() + w.slice(1)).join('');
            outputs.pascal.value = words.map(w => w[0].toUpperCase() + w.slice(1)).join('');
            outputs.snake.value = words.join('_');
            outputs.kebab.value = words.join('-');
            outputs.constant.value = words.join('_').toUpperCase();
        });

        function copyCase(id, btn) {
            const el = document.getElementById(id);
            if(!el.value) return;
            navigator.clipboard.writeText(el.value);
            const orig = btn.innerText;
            btn.innerText = "Copiato!";
            setTimeout(() => btn.innerText = orig, 1000);
        }
    </script>
</body>
</html>
