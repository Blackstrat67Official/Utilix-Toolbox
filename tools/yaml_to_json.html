<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>YAML to JSON Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        /* Stesso identico CSS del file precedente per mantenere consistenza */
        :root {
            --bg-body: #000000; --bg-container: #0a0a0a; --bg-element: #141414;
            --bg-hover: #1f1f1f; --border: rgba(255, 255, 255, 0.08); --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #ededed; --text-secondary: #888888; --accent: #8ab4f8; --error: #ff5252;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        body {
            background-color: var(--bg-body); color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: stretch; height: 100vh; padding: 1.5rem;
        }

        .container {
            background: var(--bg-container); border: 1px solid var(--border); border-radius: 12px;
            width: 100%; max-width: 1200px; display: flex; flex-direction: column; overflow: hidden;
        }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
        }
        h2 { font-size: 1rem; font-weight: 500; letter-spacing: 0.3px; }

        .btn-action {
            background: var(--bg-element); color: var(--text-primary); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500;
            transition: all 0.15s ease;
        }
        .btn-action:hover { background: var(--bg-hover); border-color: var(--border-hover); }

        .editor-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1px; flex-grow: 1; background: var(--border);
        }

        .panel { background: var(--bg-container); display: flex; flex-direction: column; }

        .panel-header {
            padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border);
            font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
        }

        textarea {
            width: 100%; flex-grow: 1; background: transparent; color: var(--text-primary);
            border: none; padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; 
            line-height: 1.6; resize: none; outline: none;
        }
        
        textarea.output { color: #fbbc04; /* Colore giallo per richiamare l'icona JSON */ }
        textarea::placeholder { color: #333; }

        .error-bar {
            background: rgba(255, 82, 82, 0.1); color: var(--error); padding: 10px 1.5rem;
            font-size: 0.85rem; border-top: 1px solid rgba(255, 82, 82, 0.2); display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>YAML to JSON</h2>
            <button class="btn-action" onclick="clearAll()">Pulisci</button>
        </div>

        <div class="error-bar" id="error-bar">YAML non valido. Controlla l'indentazione.</div>

        <div class="editor-grid">
            <div class="panel">
                <div class="panel-header">Input (YAML)</div>
                <textarea id="input" placeholder="chiave: valore" spellcheck="false"></textarea>
            </div>
            <div class="panel">
                <div class="panel-header">
                    Output (JSON)
                    <button class="btn-action" id="copy-btn" onclick="copyOutput()" style="padding: 2px 8px; font-size: 0.7rem;">Copia</button>
                </div>
                <textarea id="output" class="output" readonly placeholder="Risultato JSON..."></textarea>
            </div>
        </div>
    </div>
    
    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const errorBar = document.getElementById('error-bar');

        input.addEventListener('input', () => {
            const rawVal = input.value.trim();
            if (!rawVal) {
                output.value = "";
                errorBar.style.display = "none";
                return;
            }

            try {
                // Parso il YAML
                const yamlObj = jsyaml.load(rawVal);
                
                // Se è vuoto o stringa non valida per un JSON root
                if (typeof yamlObj !== 'object' || yamlObj === null) {
                    throw new Error("Il contenuto non è una struttura di dati valida.");
                }

                // Converto in JSON (null, 2 serve per indentare con 2 spazi)
                const jsonStr = JSON.stringify(yamlObj, null, 2);
                
                output.value = jsonStr;
                errorBar.style.display = "none";
            } catch (err) {
                errorBar.innerText = "Errore YAML: " + err.message;
                errorBar.style.display = "block";
            }
        });

        function clearAll() {
            input.value = "";
            output.value = "";
            errorBar.style.display = "none";
            input.focus();
        }

        function copyOutput() {
            if(!output.value) return;
            navigator.clipboard.writeText(output.value);
            const btn = document.getElementById('copy-btn');
            btn.innerText = "Copiato!";
            setTimeout(() => btn.innerText = "Copia", 1500);
        }
    </script>
</body>
</html>
