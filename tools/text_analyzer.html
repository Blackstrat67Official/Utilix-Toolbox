<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Text Analyzer & Minifier</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #000000; --bg-container: #0a0a0a; --bg-element: #141414;
            --bg-hover: #1f1f1f; --border: rgba(255, 255, 255, 0.08); 
            --text-primary: #ededed; --text-secondary: #888888; --accent: #e6c229;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
        body {
            background-color: var(--bg-body); color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: stretch; height: 100vh; padding: 1.5rem;
        }
        .container {
            background: var(--bg-container); border: 1px solid var(--border); border-radius: 12px;
            width: 100%; max-width: 1000px; display: flex; flex-direction: column; overflow: hidden;
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        h2 { font-size: 1rem; font-weight: 500; }
        
        .stats-bar {
            display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg-element);
            border-bottom: 1px solid var(--border);
        }
        .stat-item {
            padding: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-right: 1px solid var(--border);
        }
        .stat-item:last-child { border-right: none; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: var(--accent); font-weight: 500; }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; font-weight: 600; }
        
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; flex-grow: 1; background: var(--border); }
        .panel { background: var(--bg-container); display: flex; flex-direction: column; }
        .panel-header {
            padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border);
            font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        textarea {
            width: 100%; flex-grow: 1; background: transparent; color: var(--text-primary);
            border: none; padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; 
            line-height: 1.6; resize: none; outline: none;
        }
        textarea.output { color: #8ab4f8; word-break: break-all; } /* Colore leggermente diverso per l'output */
        textarea::placeholder { color: #333; }
        
        .btn-action {
            background: var(--bg-element); color: var(--text-primary); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: all 0.15s ease;
        }
        .btn-action:hover { background: var(--bg-hover); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Text Analyzer & Minifier</h2>
            <button class="btn-action" onclick="clearAll()" style="padding: 6px 14px; font-size: 0.8rem;">Pulisci</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="stat-chars">0</span>
                <span class="stat-label">Caratteri</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-words">0</span>
                <span class="stat-label">Parole</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-bytes">0</span>
                <span class="stat-label">Bytes</span>
            </div>
        </div>

        <div class="editor-grid">
            <div class="panel">
                <div class="panel-header">Input Originale</div>
                <textarea id="input-text" placeholder="Incolla il testo da analizzare e minimizzare..."></textarea>
            </div>
            <div class="panel">
                <div class="panel-header">
                    Testo Minimizzato (Senza spazi)
                    <button class="btn-action" id="copy-btn" onclick="copyMinified()">Copia</button>
                </div>
                <textarea id="output-text" class="output" readonly placeholder="Il testo compresso apparirà qui..."></textarea>
            </div>
        </div>
    </div>
    
    <script>
        const input = document.getElementById('input-text');
        const output = document.getElementById('output-text');
        const statChars = document.getElementById('stat-chars');
        const statWords = document.getElementById('stat-words');
        const statBytes = document.getElementById('stat-bytes');

        input.addEventListener('input', () => {
            const txt = input.value;
            
            // Seleziona la lunghezza reale della stringa (caratteri)
            statChars.innerText = txt.length;
            
            // Conta le parole basandosi sugli spazi
            const words = txt.trim().split(/\s+/).filter(w => w.length > 0);
            statWords.innerText = words.length;
            
            // Calcola i byte veri e propri (utile per UTF-8 ed emoji che pesano più byte)
            statBytes.innerText = new Blob([txt]).size;

            // Minimizzazione ESTREMA: rimuove TUTTI gli spazi bianchi (\s), inclusi tab e a capo (\n, \r)
            output.value = txt.replace(/\s+/g, '');
        });

        function clearAll() {
            input.value = "";
            output.value = "";
            statChars.innerText = "0";
            statWords.innerText = "0";
            statBytes.innerText = "0";
            input.focus();
        }

        function copyMinified() {
            if(!output.value) return;
            navigator.clipboard.writeText(output.value);
            const btn = document.getElementById('copy-btn');
            const orig = btn.innerText;
            btn.innerText = "Copiato!";
            setTimeout(() => btn.innerText = orig, 1000);
        }
    </script>
</body>
</html>
